# $http_x_forwarded_proto/-host are empty unless something upstream (Caddy)
# set them; the map falls back to nginx's own view so the server container
# still gets a sane value when this container is hit directly (e.g. local
# testing via http://host:WEB_PORT with no reverse proxy in front at all).
map $http_x_forwarded_proto $proxy_x_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}
# $http_host (not $host) in the fallback branch: nginx's $host is always
# port-stripped, which silently dropped :WEB_PORT from apiUrl when this
# container is hit directly with no reverse proxy in front — verified live,
# a direct request produced "http://localhost" instead of
# "http://localhost:8290".
map $http_x_forwarded_host $proxy_x_forwarded_host {
    default $http_x_forwarded_host;
    ''      $http_host;
}

# Security-review finding (2026-08-02): trusting X-Forwarded-Proto/-Host
# from *any* client unconditionally lets someone who reaches this
# container's LAN port directly (bypassing Caddy) feed a spoofed host into
# server/src/routes/clients.ts's apiUrl derivation — used for QR client
# pairing. Only OPNsense (192.168.0.1, where Caddy actually runs) is a
# trusted hop; a direct hit now gets nginx's own computed scheme/host
# instead of whatever the client claims. Revisit this IP if a second
# trusted hop is ever added (e.g. Cloudflare Tunnel's cloudflared
# container, not yet used for this service — see PLAN.md TODO6).
geo $trusted_proxy {
    default         0;
    192.168.0.1/32  1;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # react-router-dom's client-side routes (/providers, /recordings, ...)
    # aren't real files — unmatched paths fall back to index.html and the
    # router takes over from there.
    location / {
        try_files $uri /index.html;
    }

    # Mirrors web/vite.config.ts's dev proxy: strips the /api prefix and
    # forwards to the server container, resolved via Docker Compose's
    # embedded DNS. server/src/routes/clients.ts's apiUrl derivation (used
    # for QR client pairing) depends on X-Forwarded-Proto/-Host reflecting
    # the original external request, not this hop — see $trusted_proxy
    # above for why these aren't taken from the client unconditionally.
    location /api/ {
        proxy_pass http://server:3300/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        set $forwarded_proto $scheme;
        set $forwarded_host $http_host;
        if ($trusted_proxy) {
            set $forwarded_proto $proxy_x_forwarded_proto;
            set $forwarded_host $proxy_x_forwarded_host;
        }
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $forwarded_host;
    }
}
